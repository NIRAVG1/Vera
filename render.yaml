services:
  - type: web
    name: vera-bot
    runtime: python
    rootDir: bot_code
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: gpt-4o-mini
    healthCheckPath: /v1/healthz
